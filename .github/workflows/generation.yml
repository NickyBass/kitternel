name: Light project generation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Project generation regressions
        run: |
          python3 scripts/test-create-light.py -v
          python3 scripts/test-standalone-docker.py -v

  standalone-docker:
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Clean independent generated Docker validation
        run: python3 scripts/standalone-docker-smoke.py
