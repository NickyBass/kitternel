services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kitternel-light:local
    environment:
      PORT: "8080"
      LOG_LEVEL: info
      SHUTDOWN_TIMEOUT_SECS: "10"
      SQLITE_PATH: /data/kitternel.db
      FRONTEND_DIR: /app/public
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    volumes:
      - light-data:/data
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  light-data:
